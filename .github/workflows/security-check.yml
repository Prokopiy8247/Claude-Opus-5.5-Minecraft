name: Security check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan current files and reachable history
        run: |
          python "Unity Opus 5.5 Minecraft/Tools/check_secrets.py"
          python "Unity Opus 5.5 Minecraft/Tools/check_secrets.py" --history
